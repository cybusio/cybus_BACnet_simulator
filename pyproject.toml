[project]
name = "bacnet-simulator"
version = "0.3.0"
description = "Minimal BACnet device simulator for reproducing Cybus protocol errors"
requires-python = ">=3.12"
dependencies = [
    "bacpypes3>=0.0.98,<0.1",
    "pyyaml>=6.0",
]

[project.scripts]
bacnet-sim = "bacnet_sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bacnet_sim"]

[tool.ruff]
target-version = "py312"
line-length = 99
required-version = ">=0.15,<0.16"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "W191", "E111", "E114", "E117",
    "D206", "D300",
    "Q000", "Q001", "Q002", "Q003",
    "COM812", "ISC001",
    "D1",
    "TD003", "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"src/bacnet_sim/types.py" = ["A005"]
"tests/**/*.py" = ["S101", "ANN", "PLR2004", "PLR0913", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["bacnet_sim"]
force-single-line = true

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "BAC0>=22.9",
    "mypy>=1.14",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.15,<0.16",
    "types-pyyaml>=6.0.12.20250915",
]

[[tool.mypy.overrides]]
module = "bacpypes3.*"
ignore_missing_imports = true
