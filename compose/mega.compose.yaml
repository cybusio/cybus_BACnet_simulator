# Opt-in: a ~20001-object BACnet device for extreme large-array stress testing.
#   docker compose -f mega.compose.yaml -p bacnet_simulator up bacnet-mega
services:
  bacnet-mega:
    build: /home/dj/protocols/BACnet_simulator
    network_mode: host
    environment:
      BACNET_PROFILES_DIR: /app/profiles
      BACNET_LOG_FORMAT: json
      BACNET_LOG_LEVEL: ${BACNET_LOG_LEVEL:-INFO}
      BACNET_PACKET_DROP_PROB: ${BACNET_PACKET_DROP_PROB:-0}
      BACNET_METRICS_PORT: "9161"
    volumes:
      - /home/dj/protocols/BACnet_simulator/profiles-cybus/mega_controller.yaml:/app/profiles/mega_controller.yaml:ro
      - /home/dj/protocols/BACnet_simulator/profiles-cybus/miele_energy_meter.yaml:/app/profiles/_parents/miele_energy_meter.yaml:ro
      - /home/dj/protocols/BACnet_simulator/profiles/_base.yaml:/app/profiles/_base.yaml:ro
      - /home/dj/protocols/BACnet_simulator/profiles/vendors.yaml:/app/profiles/vendors.yaml:ro
