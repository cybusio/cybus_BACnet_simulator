# =============================================================================
# Miele Energy Meter — 3-phase power quality meter with 100 BACnet objects
# =============================================================================
#
# Simulates a Miele Professional energy monitoring gateway with era-appropriate
# BACnet integration for commercial kitchen/laundry energy management:
#
#   - protocol_revision 14: mid-range firmware
#   - max_apdu 480: standard embedded APDU size
#   - noSegmentation: cannot segment responses
#   - abort_reason 1: bufferOverflow — 101 objects exceed max_apdu on RPM
#   - Instance IDs match real Miele production hardware (101009, 101017, etc.)
#   - 94 per-phase measurement objects model a real 3-phase power quality meter
#
# Behaviors this profile triggers:
#   1. ReadPropertyMultiple on object-list exceeds max_apdu (480) → bufferOverflow abort
#   2. Individual ReadProperty works fine for each object
#   3. WhoIs/IAm discovery works normally
#
# The 100 objects are NOT padding — they represent realistic 3-phase meter
# measurements (per-phase V/I/P/Q/S, THD, harmonics, demand, min/max captures).
# The object count naturally exceeds the 480-byte RPM response limit.
#
# Tuning:
#   - Increase max_apdu to 1476 to allow RPM responses through
#   - Set segmentation to segmentedBoth to enable segmented RPM
#   - Set abort_reason to 0 to disable abort behavior entirely
# =============================================================================

extends: _base.yaml

simulator:
  port: 47808
  device_id: 1014006

device:
  vendor: MIELE
  vendor_name: "Miele Professional"
  model_name: "Miele-EnergyMeter"
  firmware_revision: "2.1"
  application_software_version: "2.1.0"
  protocol_revision: 14

network:
  max_apdu: 480
  segmentation: noSegmentation

realism:
  response_delay_ms: 25
  response_jitter_ms: 15
  tsm_pool_size: 12
  abort_reason: 1  # bufferOverflow

