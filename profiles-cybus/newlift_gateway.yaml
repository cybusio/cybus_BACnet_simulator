    default: false

  - object_type: BinaryValue
    instance: 48
    name: photocell door-A fault
    default: false

  - object_type: BinaryValue
    instance: 49
    name: photocell door-B fault
    default: false

  - object_type: BinaryValue
    instance: 50
    name: car light fault
    default: false

  - object_type: BinaryValue
    instance: 51
    name: spare fault 2
    default: false

  - object_type: BinaryValue
    instance: 52
    name: spare fault 3
    default: false

  - object_type: BinaryValue
    instance: 53
    name: spare fault 4
    default: false

  # --- Fire/emergency ---
  - object_type: BinaryValue
    instance: 54
    name: landing calls off
    default: false

  - object_type: BinaryValue
    instance: 55
    name: fire-recall
    default: false

  - object_type: BinaryValue
    instance: 56
    name: fire-recall drive active
    default: false

  - object_type: BinaryValue
    instance: 57
    name: fire-recall arrived in target floor
    default: false

  - object_type: BinaryValue
    instance: 58
    name: fireman-service
    default: false

  - object_type: BinaryValue
    instance: 59
    name: fireman-service in main floor
    default: false

  - object_type: BinaryValue
    instance: 60
    name: fireman-service drive active
    default: false

  # --- Modes ---
  - object_type: BinaryValue
    instance: 61
    name: maintenance active
    default: false

  - object_type: BinaryValue
    instance: 62
    name: service switch activated
    default: false

  - object_type: BinaryValue
    instance: 63
    name: inspection mode on
    default: false

  - object_type: BinaryValue
    instance: 66
    name: auxiliary mode on
    default: false

  - object_type: BinaryValue
    instance: 69
    name: installation mode
    default: false

  # --- Lift-off (remote shutdown) ---
  - object_type: BinaryValue
    instance: 70
