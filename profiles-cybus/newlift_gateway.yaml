  # --- Normal operation ---
  - object_type: BinaryValue
    instance: 88
    name: normal mode
    default: true

  - object_type: BinaryValue
    instance: 89
    name: normal power
    default: true

  # --- Free definable input ports ---
  - object_type: BinaryValue
    instance: 90
    name: free definable input port-1
    default: false

  - object_type: BinaryValue
    instance: 91
    name: free definable input port-2
    default: false

  - object_type: BinaryValue
    instance: 92
    name: free definable input port-3
    default: false

  - object_type: BinaryValue
    instance: 93
    name: free definable input port-4
    default: false

  - object_type: BinaryValue
    instance: 94
    name: free definable input port-5
    default: false

  - object_type: BinaryValue
    instance: 95
    name: free definable input port-6
    default: false

  - object_type: BinaryValue
    instance: 96
    name: free definable input port-7
    default: false

  - object_type: BinaryValue
    instance: 97
    name: free definable input port-8
    default: false

  - object_type: BinaryValue
    instance: 99
    name: free definable input port-9
    default: false

  # --- Extended I/O ports (NewLift maxx firmware) ---
  - object_type: BinaryValue
    instance: 100
    name: extended input port-1
    default: false

  - object_type: BinaryValue
    instance: 101
    name: extended input port-2
    default: false

  - object_type: BinaryValue
    instance: 102
    name: extended input port-3
    default: false

  - object_type: BinaryValue
    instance: 103
    name: extended input port-4
    default: false

  - object_type: BinaryValue
    instance: 104
    name: extended input port-5
    default: false

  - object_type: BinaryValue
    instance: 105
    name: extended input port-6
    default: false

  - object_type: BinaryValue
    instance: 106
    name: extended input port-7
    default: false

  - object_type: BinaryValue
    instance: 107
    name: extended input port-8
    default: false

  - object_type: BinaryValue
    instance: 108
    name: extended input port-9
    default: false

  # === MV — multi-state values ===

  # --- Directions (3 states: down, up, none) ---
  - object_type: MultiStateValue
    instance: 6
    name: system direction
    default: 3
    states: ["down", "up", "none"]

  - object_type: MultiStateValue
    instance: 7
    name: departure direction
    default: 3
    states: ["down", "up", "none"]

  - object_type: MultiStateValue
    instance: 8
    name: car drive direction
    default: 3
    states: ["down", "up", "none"]

  # --- Door status ---
  # Door A: 0 states in original config (firmware bug), use same as door B
  - object_type: MultiStateValue
    instance: 11
    name: door A status
    default: 5
    states: ["stopped", "closing", "opening", "open", "closed", "error"]

  - object_type: MultiStateValue
    instance: 17
    name: door B status
    default: 5
    states: ["stopped", "closing", "opening", "open", "closed", "error"]

  # --- Operating mode (16 states) ---
  - object_type: MultiStateValue
    instance: 73
    name: operating mode
    default: 1
    states:
      - "normal"
      - "system stopped"
      - "emergency stop"
      - "inspection"
      - "auxiliary"
      - "monitoring error"
      - "fire-recall"
      - "fireman-service"
      - "overloaded"
      - "full load"
      - "lift-off"
      - "car priority"
      - "landing priority"
      - "land. calls off"
      - "calibration"
      - "evacuation"

  # === MO — writable multi-state output ===
  - object_type: MultiStateOutput
    instance: 300
    name: Evacuation
    default: 1
    states: ["Off", "On", "Standby", "Continue"]

  # === BO — writable binary output ===
  - object_type: BinaryOutput
    instance: 303
    name: Lift Off
    default: false

# NewLift maxx scaling — set count > 0 to add per-floor AV objects after AV 85.
# Real UGW firmware scales from 106 (single elevator) to 2500+ (multi-elevator building).
# Override count via BACNET_OBJECT_PADDING env var without editing this file.
object_padding:
  template: lift_controller
  count: 0
