# Hybrid COV + poll — QA acceptance SCF
# Two BACnet connections sharing one protocol-mapper:
#   cappedDevice  -> COV-capable device with a finite COV table -> COV+poll split
#   drivenDevice  -> device whose values move -> ongoing COV notifications
# Both COV-enabled: validates the split, ongoing push, and that two COV
# connections never cross-route notifications. See README.md for pass criteria.
description: |
  Hybrid COV+poll acceptance test for the BACnet adapter.
metadata:
  name: covacceptance
  provider: cybus
  version: 1.0.0
parameters:
  cappedDeviceIp:
    type: string
    default: '172.18.0.1'
  cappedDevicePort:
    type: number
    default: 47841
  cappedDeviceInstance:
    type: number
    default: 1014007
  drivenDeviceIp:
    type: string
    default: '172.18.0.1'
  drivenDevicePort:
    type: number
    default: 47820
  drivenDeviceInstance:
    type: number
    default: 900001
  covLifetimeSeconds:
    type: number
    default: 300
  pollIntervalMs:
    type: number
    default: 10000
resources:
  cappedDevice:
    type: Cybus::Connection
    properties:
      protocol: Bacnet
      targetState: connected
      connection:
        deviceInstance: !ref cappedDeviceInstance
        deviceAddress: !sub '${cappedDeviceIp}:${cappedDevicePort}'
        cov:
          enabled: true
          lifetimeSeconds: !ref covLifetimeSeconds
  capped101000:
    type: Cybus::Endpoint
    properties:
      protocol: Bacnet
      connection: !ref cappedDevice
      topic: capped/AV101000
      subscribe:
        interval: !ref pollIntervalMs
        property: present-value
        objectType: analog-value
        objectInstance: 101000
  capped101001:
    type: Cybus::Endpoint
    properties:
      protocol: Bacnet
      connection: !ref cappedDevice
      topic: capped/AV101001
      subscribe:
        interval: !ref pollIntervalMs
        property: present-value
        objectType: analog-value
        objectInstance: 101001
