repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
        args: [--strict]
        pass_filenames: false
        entry: mypy src/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe] # Cybus SCFs use custom tags (!ref/!sub); check structure, not tag construction
      - id: check-added-large-files
        args: [--maxkb=100]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-docs
        name: doc-drift guard (README/TESTING vs the repo)
        entry: bash qa/tools/check-docs.sh
        language: system
        pass_filenames: false
        always_run: true
